<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squat Form Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Landing screen -->
  <div id="landing">
    <div class="landing-content">
      <h1>Squat Form Tracker</h1>
      <p class="subtitle">Real-time pose estimation &amp; form analysis</p>
      <button id="btn-start" class="btn btn-primary btn-large">Start</button>
      <p class="hint">Opens fullscreen with camera tracking</p>
    </div>
  </div>

  <!-- Fullscreen tracking view -->
  <div id="tracker" class="hidden">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>

    <!-- Top bar overlay -->
    <div class="overlay-top">
      <div class="overlay-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Loading...</span>
      </div>
      <button id="btn-stop" class="btn btn-stop-overlay">Exit</button>
    </div>

    <!-- Stats overlay (bottom-left) -->
    <div class="overlay-stats">
      <div class="hud-stat">
        <span class="hud-label">Reps</span>
        <span class="hud-value" id="rep-count">0</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Knee</span>
        <span class="hud-value" id="knee-angle">--°</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Hip</span>
        <span class="hud-value" id="hip-angle">--°</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Form</span>
        <span class="hud-value" id="form-score">--</span>
      </div>
      <div class="hud-depth">
        <div class="hud-depth-bar" id="depth-bar"></div>
      </div>
    </div>

    <!-- Rolling feedback overlay (right side) -->
    <div class="overlay-feedback">
      <div class="feedback-header">Live Feedback</div>
      <div id="feedback-roll" class="feedback-roll"></div>
    </div>

    <!-- Rep history panel (slides in from right) -->
    <button id="btn-history" class="btn-history-toggle">History</button>
    <div id="history-panel" class="history-panel hidden">
      <div class="history-header">
        <h3>Rep History</h3>
        <button id="btn-close-history" class="btn-close-history">&times;</button>
      </div>
      <div id="history-list" class="history-list">
        <p class="history-empty">Complete a squat to see feedback here.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
